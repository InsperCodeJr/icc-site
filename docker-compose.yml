services:

  backend:
    build:
      context: ./ICC-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ICC-backend:/app
      - media_files:/app/media
    environment:
      - DEBUG=True
    restart: unless-stopped

  frontend:
    build:
      context: ./ICC-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./ICC-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_files: