services:

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=iccsite
      - POSTGRES_USER=iccuser
      - POSTGRES_PASSWORD=iccpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iccuser -d iccsite"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./ICC-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ICC-backend:/app
      - media_files:/app/media
    env_file:
      - ./ICC-backend/.env
    environment:
      - DEBUG=True
      - DB_NAME=iccsite
      - DB_USER=iccuser
      - DB_PASSWORD=iccpassword
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ICC-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./ICC-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_files:
  postgres_data: